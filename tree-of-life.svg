<svg viewBox="0 0 360 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tree of Life">
  <defs>
    <radialGradient id="node" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#313244"/>
      <stop offset="100%" stop-color="#11111b"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#45304f"/>
      <stop offset="100%" stop-color="#11111b"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="360" height="450" rx="18" fill="#181825"/>

  <!-- the 22 paths -->
  <g stroke="#6c7086" stroke-width="1.2" opacity="0.8" fill="none">
    <line x1="180" y1="35"  x2="270" y2="95"/>
    <line x1="180" y1="35"  x2="90"  y2="95"/>
    <line x1="180" y1="35"  x2="180" y2="245"/>
    <line x1="90"  y1="95"  x2="270" y2="95"/>
    <line x1="270" y1="95"  x2="180" y2="245"/>
    <line x1="270" y1="95"  x2="270" y2="190"/>
    <line x1="90"  y1="95"  x2="180" y2="245"/>
    <line x1="90"  y1="95"  x2="90"  y2="190"/>
    <line x1="270" y1="190" x2="90"  y2="190"/>
    <line x1="270" y1="190" x2="180" y2="245"/>
    <line x1="270" y1="190" x2="270" y2="300"/>
    <line x1="90"  y1="190" x2="180" y2="245"/>
    <line x1="90"  y1="190" x2="90"  y2="300"/>
    <line x1="180" y1="245" x2="270" y2="300"/>
    <line x1="180" y1="245" x2="90"  y2="300"/>
    <line x1="180" y1="245" x2="180" y2="350"/>
    <line x1="270" y1="300" x2="90"  y2="300"/>
    <line x1="270" y1="300" x2="180" y2="350"/>
    <line x1="270" y1="300" x2="180" y2="410"/>
    <line x1="90"  y1="300" x2="180" y2="350"/>
    <line x1="90"  y1="300" x2="180" y2="410"/>
    <line x1="180" y1="350" x2="180" y2="410"/>
  </g>

  <!-- the sephirot -->
  <g fill="url(#node)" stroke="#cba6f7" stroke-width="1.6" filter="url(#glow)">
    <circle cx="180" cy="35"  r="24"/>
    <circle cx="270" cy="95"  r="24"/>
    <circle cx="90"  cy="95"  r="24"/>
    <circle cx="270" cy="190" r="24"/>
    <circle cx="90"  cy="190" r="24"/>
    <circle cx="180" cy="245" r="24" fill="url(#core)" stroke="#f9e2af"/>
    <circle cx="270" cy="300" r="24"/>
    <circle cx="90"  cy="300" r="24"/>
    <circle cx="180" cy="350" r="24"/>
    <circle cx="180" cy="410" r="24" stroke="#a6e3a1"/>
  </g>

  <!-- Da'at: the sphere that is not a sphere -->
  <circle cx="180" cy="135" r="17" fill="none" stroke="#cba6f7" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.85"/>

  <!-- names -->
  <g font-family="'Fira Code', ui-monospace, Menlo, Consolas, monospace" font-size="8" letter-spacing="0.6" text-anchor="middle" fill="#cdd6f4">
    <text x="180" y="38">KETER</text>
    <text x="270" y="98">CHOKMAH</text>
    <text x="90"  y="98">BINAH</text>
    <text x="270" y="193">CHESED</text>
    <text x="90"  y="193">GEVURAH</text>
    <text x="180" y="248" fill="#f9e2af">TIFERET</text>
    <text x="270" y="303">NETZACH</text>
    <text x="90"  y="303">HOD</text>
    <text x="180" y="353">YESOD</text>
    <text x="180" y="413" fill="#a6e3a1">MALKUTH</text>
    <text x="180" y="138" font-size="6.5" fill="#9399b2">DA'AT</text>
  </g>
</svg>
